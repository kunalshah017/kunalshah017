name: Generate profile cards

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # all cards share one size and GitHub's own light and dark themes; no animation is the default
      # AUTO_PUSH is off so nothing is committed to main; the cards go to the output branch below
      - name: generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          NAME: Kunal Shah
          TIME_ZONE: Asia/Kolkata
          AUTO_PUSH: false

      - name: keep the GitHub light and dark themes
        run: |
          mkdir -p dist
          cp -r profile-summary-card-output/github dist/light
          cp -r profile-summary-card-output/github_dark dist/dark
          ls dist/light dist/dark

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file>
      - name: push the cards to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
